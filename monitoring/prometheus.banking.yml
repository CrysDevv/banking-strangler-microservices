# Archivo NUEVO (no modifica monitoring/prometheus.yml heredado).
# Config de Prometheus con los targets del sistema bancario. Para usar la heredada tal cual:
#   PROMETHEUS_CONFIG_FILE=prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Metricas que el OTel Collector reexpone (exporter prometheus, puerto 8889 por convencion).
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: core-springboot
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['core-springboot:8080']
        labels: { service: core-springboot, stack: java17 }

  - job_name: bff-nestjs
    metrics_path: /metrics
    static_configs:
      - targets: ['bff-nestjs:3000']
        labels: { service: bff-nestjs, stack: node20 }

  - job_name: audit-fastapi
    metrics_path: /metrics
    static_configs:
      - targets: ['audit-fastapi:8000']
        labels: { service: audit-fastapi, stack: python312 }
