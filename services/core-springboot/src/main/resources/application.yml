server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: core-springboot
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=BankingCore;encrypt=true;trustServerCertificate=true}
    username: ${SPRING_DATASOURCE_USERNAME:banking_app}
    password: ${SPRING_DATASOURCE_PASSWORD:App#Banking2026}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:banking}
    password: ${SPRING_RABBITMQ_PASSWORD:Rabbit#Bus2026}

banking:
  jwt:
    secret: ${APP_JWT_SECRET:cambia-este-secreto-por-uno-de-al-menos-32-caracteres-aleatorios}
  outbox:
    fixed-rate-ms: 3000
    batch-size: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"
